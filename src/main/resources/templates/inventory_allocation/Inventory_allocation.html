<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>在庫引当</title>

<link rel="stylesheet" href="/css/common.css">

<style>
/* ========================================
   在庫引当 デザイン確認用
   ======================================== */

.main-container {
    max-width: 1050px;
    margin: 0 auto;
    padding: 20px 12px;
}

.main-container h2 {
    margin: 0 0 28px;
    font-size: 24px;
    font-weight: normal;
    color: #333;
}

/* ========================================
   パネル
   ======================================== */

.system-panel {
    border: 1px solid #666;
    margin-bottom: 20px;
    background-color: #fff;
}

.system-header {
    background-color: #333;
    color: #fff;
    font-weight: bold;
    font-size: 16px;
    padding: 17px 18px;
}

.system-body {
    padding: 20px;
}

/* ========================================
   製造指示情報
   ======================================== */

.order-information {
    display: grid;
    grid-template-columns: 1fr 1fr;
    column-gap: 24px;
}

.information-row {
    display: grid;
    grid-template-columns: 160px 1fr;
    align-items: center;
    min-height: 52px;
}

.information-label {
    font-size: 14px;
    font-weight: bold;
    color: #222;
    white-space: nowrap;
}

.information-value-area {
    display: flex;
    align-items: center;
    gap: 5px;
}

/* ========================================
   入力欄
   ======================================== */

.information-control {
    height: 41px;
    padding: 6px 11px;
    border: 1px solid #aaa;
    border-radius: 0;
    background-color: #fff;
    color: #222;
    font-size: 14px;
    box-sizing: border-box;
}

.mo-number {
    width: 278px;
}

.item-code {
    width: 124px;
}

.item-name {
    width: 155px;
}

.quantity-control {
    width: 278px;
}

.small-control {
    width: 278px;
}

/* ========================================
   引当状況サマリー
   ======================================== */

.allocation-summary {
    display: flex;
    align-items: center;
    gap: 45px;

    margin: 20px -20px -20px;
    padding: 20px;

    border-top: 1px solid #aaa;
    background-color: #fafafa;
}

.summary-item {
    display: flex;
    align-items: center;
    gap: 5px;
    font-size: 14px;
    color: #444;
}

.summary-value {
    color: #111;
    font-size: 18px;
    font-weight: bold;
}

.summary-value.possible {
    color: #1976d2;
}

/* ========================================
   部品一覧
   ======================================== */

.allocation-table-wrapper {
    width: 100%;
    overflow-x: auto;
}

.allocation-table {
    width: 100%;
    min-width: 900px;
    table-layout: fixed;
    border-collapse: collapse;
    font-size: 13px;
}

.allocation-table th,
.allocation-table td {
    border: 1px solid #aaa;
    padding: 8px;
    height: 50px;
    box-sizing: border-box;
}

.allocation-table th {
    background-color: #f5f5f5;
    color: #111;
    text-align: center;
    font-weight: bold;
}

.allocation-table td {
    background-color: #fff;
}

.checkbox-column {
    width: 70px;
}

.code-column {
    width: 120px;
}

.name-column {
    width: 150px;
}

.unit-column {
    width: 65px;
}

.number-column {
    width: 105px;
}

.shortage-column {
    width: 80px;
}

.center-cell {
    text-align: center;
}

.code-cell,
.name-cell {
    text-align: left;
}

.number-cell {
    text-align: right;
}

/* ========================================
   チェックボックス
   ======================================== */

.allocation-table input[type="checkbox"],
.select-all-area input[type="checkbox"] {
    width: 19px;
    height: 19px;
    accent-color: #347bd3;
    cursor: pointer;
}

/* ========================================
   今回引当数
   ======================================== */

.allocation-number-input {
    width: 65px;
    height: 40px;
    padding: 4px 8px;

    border: 1px solid #aaa;
    border-radius: 0;

    background-color: #fff;
    color: #111;

    text-align: right;
    font-size: 14px;
}

/* ========================================
   横スクロール
   ======================================== */

.allocation-table-wrapper::-webkit-scrollbar {
    height: 16px;
}

.allocation-table-wrapper::-webkit-scrollbar-track {
    background: #eee;
}

.allocation-table-wrapper::-webkit-scrollbar-thumb {
    background: #999;
    border-radius: 8px;
}

/* ========================================
   全選択
   ======================================== */

.select-all-area {
    display: flex;
    align-items: center;
    gap: 10px;

    margin-top: 15px;
    padding-left: 5px;

    color: #444;
    font-size: 13px;
    cursor: pointer;
}

/* ========================================
   下部ボタン
   ======================================== */

.allocation-button-area {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-top: 24px;
}

.right-buttons {
    display: flex;
    align-items: center;
    gap: 10px;
}

.back-button,
.clear-button,
.allocation-button {
    height: 50px;
    font-size: 18px;
    font-weight: bold;
    cursor: pointer;
}

/* 戻る */

.back-button {
    width: 200px;

    background-color: #eee;
    color: #000;

    border: 1px solid #aaa;
}

/* 引当クリア */

.clear-button {
    width: 200px;

    background-color: #eee;
    color: #000;

    border: 1px solid #aaa;
}

/* 引当実行 */

.allocation-button {
    width: 200px;

    background-color: #5592e3;
    color: #fff;

    border: 1px solid #5592e3;
}

.allocation-button:hover {
    background-color: #3f7fce;
}

/* ========================================
   レスポンシブ
   ======================================== */

@media (max-width: 850px) {

    .order-information {
        grid-template-columns: 1fr;
    }

    .allocation-summary {
        flex-wrap: wrap;
        gap: 20px;
    }

    .allocation-button-area {
        gap: 15px;
    }

    .back-button,
    .clear-button,
    .allocation-button {
        width: 160px;
    }
}
</style>

</head>

<body>

<div class="main-container">

    <h2>在庫引当</h2>

    <!-- ======================================
         製造指示情報
         ====================================== -->

    <div class="system-panel">

        <div class="system-header">
            製造指示情報
        </div>

        <div class="system-body">

            <div class="order-information">

                <!-- 左側 -->
                <div>

                    <div class="information-row">

                        <div class="information-label">
                            製造指示番号
                        </div>

                        <div class="information-value-area">

                            <input
                                type="text"
                                class="information-control mo-number"
                                value="MO20261025-001"
                                readonly>

                        </div>

                    </div>


                    <div class="information-row">

                        <div class="information-label">
                            製品品目
                        </div>

                        <div class="information-value-area">

                            <input
                                type="text"
                                class="information-control item-code"
                                value="EV-PRO-01"
                                readonly>

                            <input
                                type="text"
                                class="information-control item-name"
                                value="電動アシスト自転車"
                                readonly>

                        </div>

                    </div>


                    <div class="information-row">

                        <div class="information-label">
                            製造数量
                        </div>

                        <div class="information-value-area">

                            <input
                                type="text"
                                class="information-control quantity-control"
                                value="10 台"
                                readonly>

                        </div>

                    </div>

                </div>


                <!-- 右側 -->
                <div>

                    <div class="information-row">

                        <div class="information-label">
                            開始日
                        </div>

                        <input
                            type="text"
                            class="information-control small-control"
                            value="2026/10/25"
                            readonly>

                    </div>


                    <div class="information-row">

                        <div class="information-label">
                            納期
                        </div>

                        <input
                            type="text"
                            class="information-control small-control"
                            value="2026/10/30"
                            readonly>

                    </div>


                    <div class="information-row">

                        <div class="information-label">
                            ステータス
                        </div>

                        <input
                            type="text"
                            class="information-control small-control"
                            value="未開始"
                            readonly>

                    </div>

                </div>

            </div>


            <!-- 引当状況 -->

            <div class="allocation-summary">

                <div class="summary-item">
                    <span>指示数量</span>
                    <span class="summary-value">10台</span>
                </div>

                <div class="summary-item">
                    <span>今回製造可能数</span>
                    <span class="summary-value possible">8台</span>
                </div>

                <div class="summary-item">
                    <span>未引当残</span>
                    <span class="summary-value">2台</span>
                </div>

            </div>

        </div>

    </div>


    <!-- ======================================
         引当対象部品一覧
         ====================================== -->

    <div class="system-panel">

        <div class="system-header">
            引当対象部品一覧
        </div>

        <div class="system-body">

            <div class="allocation-table-wrapper">

                <table class="allocation-table">

                    <thead>

                    <tr>

                        <th class="checkbox-column">
                            選択
                        </th>

                        <th class="code-column">
                            品目コード
                        </th>

                        <th class="name-column">
                            品目名
                        </th>

                        <th class="unit-column">
                            単位
                        </th>

                        <th class="number-column">
                            10台所要量
                        </th>

                        <th class="number-column">
                            有効在庫
                        </th>

                        <th class="number-column">
                            8台所要量
                        </th>

                        <th class="number-column">
                            今回引当数
                        </th>

                        <th class="shortage-column">
                            不足数
                        </th>

                    </tr>

                    </thead>


                    <tbody>

                    <!-- フレームASSY -->

                    <tr>

                        <td class="center-cell">
                            <input type="checkbox" checked>
                        </td>

                        <td class="code-cell">
                            EV-FRM-01
                        </td>

                        <td class="name-cell">
                            フレームASSY
                        </td>

                        <td class="center-cell">
                            台
                        </td>

                        <td class="number-cell">
                            10
                        </td>

                        <td class="number-cell">
                            8
                        </td>

                        <td class="number-cell">
                            8
                        </td>

                        <td class="number-cell">

                            <input
                                type="text"
                                class="allocation-number-input"
                                value="8"
                                readonly>

                        </td>

                        <td class="number-cell">
                            2
                        </td>

                    </tr>


                    <!-- バッテリー -->

                    <tr>

                        <td class="center-cell">
                            <input type="checkbox" checked>
                        </td>

                        <td class="code-cell">
                            EV-BAT-01
                        </td>

                        <td class="name-cell">
                            バッテリー
                        </td>

                        <td class="center-cell">
                            個
                        </td>

                        <td class="number-cell">
                            20
                        </td>

                        <td class="number-cell">
                            25
                        </td>

                        <td class="number-cell">
                            16
                        </td>

                        <td class="number-cell">

                            <input
                                type="text"
                                class="allocation-number-input"
                                value="16"
                                readonly>

                        </td>

                        <td class="number-cell">
                            0
                        </td>

                    </tr>


                    <!-- モーター -->

                    <tr>

                        <td class="center-cell">
                            <input type="checkbox" checked>
                        </td>

                        <td class="code-cell">
                            EV-MTR-01
                        </td>

                        <td class="name-cell">
                            モーター
                        </td>

                        <td class="center-cell">
                            個
                        </td>

                        <td class="number-cell">
                            10
                        </td>

                        <td class="number-cell">
                            10
                        </td>

                        <td class="number-cell">
                            8
                        </td>

                        <td class="number-cell">

                            <input
                                type="text"
                                class="allocation-number-input"
                                value="8"
                                readonly>

                        </td>

                        <td class="number-cell">
                            0
                        </td>

                    </tr>

                    </tbody>

                </table>

            </div>


            <!-- 全選択 -->

            <label class="select-all-area">

                <input type="checkbox" checked>

                <span>
                    すべて選択 / 解除
                </span>

            </label>

        </div>

    </div>


    <!-- ======================================
         ボタン
         ====================================== -->

    <div class="allocation-button-area">

        <button
            type="button"
            class="back-button">
            戻る
        </button>


        <div class="right-buttons">

            <button
                type="button"
                class="clear-button">
                引当クリア
            </button>

            <button
                type="button"
                class="allocation-button">
                引当実行
            </button>

        </div>

    </div>

</div>

</body>
</html>
