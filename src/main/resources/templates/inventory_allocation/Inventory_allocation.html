<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>在庫引当</title>
<link rel="stylesheet" href="/css/common.css">
<link rel="stylesheet" href="/css/inventory_allocation.css">
<style>
</style>
</head>
<body>
<div class="main-container">
    <h2>在庫引当</h2>
    <!-- ======================================
         製造指示情報
         ====================================== -->
    <div class="system-panel">
        <div class="system-header">
            製造指示情報
        </div>
        <form th:action="@{/searchManufactureOrder}" th:object="${manufactureOrderSearchForm}" method="post">
            
        <div class="system-body">
            <div class="order-information">
                <!-- 左側 -->
                <div>
                    <div class="information-row">
                        <div class="information-label">
                            製造指示番号
                        </div>
                        <div class="information-value-area">
                            <select class="information-control mo-number" th:field="*{moNo}">
                                <option value=""></option>
                                <option th:each="mo : ${orderNoList}"
                                    th:value="${mo.moNo}"
                                    th:text="${mo.moNo}">    
                            </select>
                            <span class="text-danger" th:if="${#fields.hasErrors('moNo')}" th:errors="*{moNo}"></span>
                        </div>
                    </div>
                    <div class="information-row">
                        <div class="information-label">
                            製品品目
                        </div>
                        <div class="information-value-area">
                            <input type="text" class="information-control item-code" th:field="*{itemId}" readonly tabindex="-1"/>
                            <input type="text" class="information-control item-name" th:field="*{itemName}" readonly tabindex="-1"/>
                        </div>
                    </div>
                    <div class="information-row">
                        <div class="information-label">
                            製造数量
                        </div>
                        <div class="information-value-area">
                            <input type="text" class="information-control quantity-control" th:field="*{orderQty}" readonly　tabindex="-1">
                        </div>
                    </div>
                </div>
                <!-- 右側 -->
                <div>
                    <div class="information-row">
                        <div class="information-label">
                            開始日
                        </div>
                        <input type="text" class="information-control small-control" th:field="*{startDate}" readonly tabindex="-1">
                    </div>
                    <div class="information-row">
                        <div class="information-label">
                            納期
                        </div>
                        <input type="text" class="information-control small-control" th:field="*{dueDate}" readonly tabindex="-1">                    </div>
                    <div class="information-row">
                        <div class="information-label">
                            ステータス
                        </div>
                        <input type="text" class="information-control small-control" th:field="*{status}" readonly tabindex="-1">                    </div>
                </div>
            </div>
            <!-- 引当状況 -->
            <div class="allocation-summary">
                <div class="summary-item">
                    <span>指示数量</span>
                    <span class="summary-value">10台</span>
                </div>
                <div class="summary-item">
                    <span>今回製造可能数</span>
                    <span class="summary-value possible">8台</span>
                </div>
                <div class="summary-item">
                    <span>未引当残</span>
                    <span class="summary-value">2台</span>
                </div>
            </div>
        </div>
        </form>
    </div>
    <!-- ======================================
         引当対象部品一覧
         ====================================== -->
    <div class="system-panel">
        <div class="system-header">
            引当対象部品一覧
        </div>
        <div class="system-body">
            <div class="allocation-table-wrapper">
                <table class="allocation-table">
                    <thead>
                    <tr>
                        <th class="checkbox-column">
                            選択
                        </th>
                        <th class="code-column">
                            品目コード
                        </th>
                        <th class="name-column">
                            品目名
                        </th>
                        <th class="unit-column">
                            単位
                        </th>
                        <th class="number-column">
                            10台所要量
                        </th>
                        <th class="number-column">
                            有効在庫
                        </th>
                        <th class="number-column">
                            8台所要量
                        </th>
                        <th class="number-column">
                            今回引当数
                        </th>
                        <th class="shortage-column">
                            不足数
                        </th>
                    </tr>
                    </thead>
                    <tbody>
                    <!-- フレームASSY -->
                    <tr>
                        <td class="center-cell">
                            <input type="checkbox" checked>
                        </td>
                        <td class="code-cell">
                            EV-FRM-01
                        </td>
                        <td class="name-cell">
                            フレームASSY
                        </td>
                        <td class="center-cell">
                            台
                        </td>
                        <td class="number-cell">
                            10
                        </td>
                        <td class="number-cell">
                            8
                        </td>
                        <td class="number-cell">
                            8
                        </td>
                        <td class="number-cell">
                            <input
                                type="text"
                                class="allocation-number-input"
                                value="8"
                                readonly>
                        </td>
                        <td class="number-cell">
                            2
                        </td>
                    </tr>
                    </tbody>
                </table>
            </div>
            <!-- 全選択 -->
            <label class="select-all-area">
                <input type="checkbox" checked>
                <span>
                    すべて選択 / 解除
                </span>
            </label>
        </div>
    </div>
    <!-- ======================================
         ボタン
         ====================================== -->
    <div class="allocation-button-area">
        <button
            type="button"
            class="back-button">
            戻る
        </button>
        <div class="right-buttons">
            <button
                type="button"
                class="clear-button">
                引当クリア
            </button>
            <button
                type="button"
                class="allocation-button">
                引当実行
            </button>
        </div>
    </div>
</div>
<div style="margin-top: 15px; text-align: right;">
    <a th:href="@{/productionmanagement/menu}" style="color: #666; text-decoration: none;">← メニューへ戻る</a>
</div>
</body>
</html>
