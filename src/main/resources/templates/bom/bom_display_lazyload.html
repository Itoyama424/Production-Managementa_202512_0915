<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
	<script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>

    <meta charset="UTF-8">
    <title>■ BOM展開画面 LazyLoad ■</title>
    <link rel="stylesheet" th:href="@{/css/common.css}">
</head>
<body>
<script>
$(document).ready(function() {
	$('.system-table').on('click','.explotion-btn',function() {
		
		const $btn = $(this);
		
		const itemId = $(this).closest('.bom-row').data('item_id');
		const level = $(this).closest('.bom-row').data('level');
		const baseDate = $('#baseDate').val();
		const currentRow = $(this).closest('tr');
		
		const params = new URLSearchParams(
			{
				itemId: itemId,
				level: level,
				baseDate: baseDate
			}
		);
		
		$.ajax({
			url:'/productionmanagement/explosionChildren',
			type:'GET',
			data:params.toString(),
			dataType:'html'
		}).done((data) => {
			// 展開処理
			$btn.prop("disabled", true);

			// 色変更
			$btn.addClass("expanded");
			currentRow.after(data);
		});
		

	});
	
});
</script>
    <div class="main-container">
        <h2>■ BOM展開画面 LazyLoad ■</h2>
        
        <div class="info-box">
            <strong>生産対象：</strong> <span th:text="${explosionResult.itemName}"></span> (<span th:text="${explosionResult.itemId}"></span>)           
        </div>
		<input type="hidden" id="baseDate" th:value="${#temporals.format(explosionResult.baseDate, 'yyyy-MM-dd')}" />
        <table class="system-table">
            <thead>
                <tr>
                    <th>部品構成（階層）</th>
                    <th>単位</th>
                    <th>構成数（親1当り）</th> 
					<th>備 考</th>                
                </tr>
            </thead>
            <tbody>
				<tr th:fragment="bomRowFragment"
					th:each="child : ${explosionResult.bomExplosionList}" 
				    class="bom-row"
				    th:data-item_id="${child.itemId}"
				    th:data-level="${child.level}">
				    <td>
                        <span th:style="|padding-left: ${child.level * 20}px;|">
                            <button type="button" class="explotion-btn">＋</button>
                            <span th:text="${child.level == 0 ? '' : '└ '}"></span>
                            <span th:text="${child.itemId}"></span>
                            <span th:text="' [' + ${child.itemName} + ']'"></span>
                        </span>
				    </td>
                    <td th:text="${child.unit}"></td>
                    <td th:text="${child.quantityDisp}"></td>
					<td th:text="${child.remarks}"></td>
                </tr>
            </tbody>
        </table>

        <div class="mt-20">
            <a th:href="@{/productionmanagement/init/bomlazyload}">← 指示入力へ戻る</a>
        </div>
    </div>
</body>
</html>
