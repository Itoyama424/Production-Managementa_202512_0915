<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <title>製造指示入力</title>
    <link rel="stylesheet" th:href="@{/css/common.css}">
    <style>
        /* ===== 製造指示入力画面専用 ===== */
        .order-body {
            min-height: 490px;
        }

        .order-row {
            display: flex;
            align-items:flex-start;
            margin-bottom: 16px;
        }

        .order-label {
            width: 140px;
            flex-shrink: 0;
            font-weight: bold;
            padding-top: 10px;
        }

        .order-input {
            width: 300px;
        }

        .order-number {
            width: 180px;
            text-align: right;
            font-size: 17px;
        }

        .order-date {
            width: 200px;
        }

        .order-select {
            width: 300px;
        }

        .order-auto-button {
            margin-left: 15px;
            width: 105px;
            height: 38px;
            padding: 0;
        }

        .order-remarks-row {
            align-items: flex-start;
        }

        .order-remarks {
            width: 600px;
            height: 100px;
            resize: vertical;
        }

        .order-button-area {
            display: flex;
            justify-content: space-between;
            margin-top: 24px;
        }
    </style>
</head>

<body>
    <div class="main-container">
        <h2>製造指示入力</h2>
        <div class="system-panel">
            <div class="system-header">
                製造指示情報
            </div>
            <form th:action="@{/productionmanagement/manufactureorder/register}" th:object="${manufactureOrderForm}"
                method="post">
                <div class="system-body order-body">

                    <!-- 製品品目 -->
                    <div class="order-row">
                        <label class="order-label">
                            製品品目
                            <span color="red" class="required">*</span>
                        </label>
                        <div class="order-field">
                            <select class="form-control order-select" th:field="*{itemId}">
                                <option value=""></option>
                                <option th:each="product : ${itemList}" 
                                    th:value="${product.itemId}"
                                    th:text="${product.itemName}">
                                </option>

                            </select>
                            <span class="text-danger" th:if="${#fields.hasErrors('itemId')}"
                                th:errors="*{itemId}"></span>
                        </div>
                    </div>
                    <!-- 製造数量 -->
                    <div class="order-row">
                        <label class="order-label">
                            製造数量
                            <span class="required">*</span>
                        </label>
                        <div class="order-field">
                            <input type="number" class="form-control order-number" th:field="*{orderQty}">
                            <span class="text-danger" th:if="${#fields.hasErrors('orderQty')}"
                                th:errors="*{orderQty}"></span>
                        </div>
                    </div>
                    <!-- 開始日 -->
                    <div class="order-row">
                        <label class="order-label">
                            開始日
                            <span class="required">*</span>
                        </label>
                        <div class="order-field">
                            <input type="date" class="form-control order-date" th:field="*{startDate}">
                            <span class="text-danger" th:if="${#fields.hasErrors('startDate')}"
                                th:errors="*{startDate}"></span>
                        </div>
                    </div>
                    <!-- 納期 -->
                    <div class="order-row">
                        <label class="order-label">
                            納期
                            <span class="required">*</span>
                        </label>
                        <div class="order-field">
                            <input type="date" class="form-control order-date" th:field="*{dueDate}">
                            <span class="text-danger" th:if="${#fields.hasErrors('dueDate')}"
                                th:errors="*{dueDate}"></span>
                        </div>
                    </div>
                    <!-- ステータス -->
                    <div class="order-row">
                        <label class="order-label">
                            ステータス
                            <span class="required">*</span>
                        </label>
                        <div class="order-field">
                            <select class="form-control order-select" th:field="*{status}">
                                <option value=""></option>
                                <option th:each="status : ${statusList}" th:value="${status.name()}"
                                    th:text="${status.label}">
                                </option>
                            </select>
                            <span class="text-danger" th:if="${#fields.hasErrors('status')}"
                                th:errors="*{status}"></span>
                        </div>
                    </div>

                    <!-- 備考 -->
                    <div class="order-row order-remarks-row">
                        <label class="order-label">
                            備考
                        </label>
                        <textarea class="form-control order-remarks" th:field="*{remarks}" />
                    </div>
                    <!-- 下部ボタン -->
                    <div class="order-button-area">
                        <button type="button" class="btn-secondary">
                            キャンセル
                        </button>
                        <button type="submit" class="btn-action">
                            製造指示を登録
                        </button>
                    </div>
                </div>
            </form>
        </div>
        <div style="margin-top: 15px; text-align: right;">
            <a th:href="@{/productionmanagement/menu}" style="color: #666; text-decoration: none;">← メニューへ戻る</a>
        </div>
    </div>
</body>

</html>
