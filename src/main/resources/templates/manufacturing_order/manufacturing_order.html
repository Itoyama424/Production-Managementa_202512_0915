<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
<meta charset="UTF-8">
<title>製造指示入力</title>

<link rel="stylesheet" th:href="@{/css/common.css}">

<style>

/* ===== 製造指示入力画面専用 ===== */
/* 入力欄の枠線を少し濃くする */
.order-input,
.order-number,
.order-date,
.order-select,
.order-remarks {
    border: 1px solid #999;
}
.order-page {
    max-width: 1200px;
    margin: 30px auto;
}

.order-panel {
    border: 1px solid #ccc;
    background-color: #fff;
}

.order-panel-header {
    background-color: #f2f2f2;
    border-bottom: 1px solid #ccc;
    padding: 15px 20px;
    font-size: 16px;
    font-weight: bold;
}

.order-body {
    padding: 30px;
    min-height: 490px;
}

.order-row {
    display: flex;
    align-items: center;
    margin-bottom: 16px;
}

.order-label {
    width: 140px;
    flex-shrink: 0;
    font-weight: bold;
}

.required {
    color: red;
    margin-left: 3px;
}

.order-input {
    width: 300px;
}

.order-number {
    width: 180px;
    text-align: right;
}

.order-date {
    width: 200px;
}

.order-select {
    width: 300px;
}

.order-auto-button {
    margin-left: 15px;
    width: 105px;
    height: 38px;
    border: 1px solid #bbb;
    background-color: #eee;
    border-radius: 3px;
    cursor: pointer;
}

.order-remarks-row {
    align-items: flex-start;
}

.order-remarks {
    width: 600px;
    height: 100px;
    resize: vertical;
}

.order-button-area {
    display: flex;
    justify-content: space-between;
    margin-top: 24px;
}

.order-cancel {
    width: 150px;
    height: 44px;
    border: 1px solid #bbb;
    background-color: #eee;
    border-radius: 3px;
    font-weight: bold;
    cursor: pointer;
}

.order-register {
    width: 200px;
    height: 44px;
    border: none;
    border-radius: 3px;
    background-color: #2671d9;
    color: white;
    font-weight: bold;
    cursor: pointer;
}

.order-register:hover {
    background-color: #175dbb;
}

</style>

</head>

<body>

<div class="order-page">

    <h2>製造指示入力</h2>

    <div class="order-panel">

        <div class="order-panel-header">
            製造指示情報
        </div>

        <div class="order-body">

            <!-- 製造指示番号 -->
            <div class="order-row">

                <label class="order-label">
                    製造指示番号
                    <span class="required">*</span>
                </label>

                <input type="text"
                       class="form-control order-input"
                       value="MO20261025-001">

                <button type="button"
                        class="order-auto-button">
                    自動採番
                </button>

            </div>


            <!-- 製品品目 -->
            <div class="order-row">

                <label class="order-label">
                    製品品目
                    <span class="required">*</span>
                </label>

                <input type="text"
                       class="form-control order-input"
                       value="EV-PRO-01">

            </div>


            <!-- 製造数量 -->
            <div class="order-row">

                <label class="order-label">
                    製造数量
                    <span class="required">*</span>
                </label>

                <input type="number"
                       class="form-control order-number"
                       value="10">

            </div>


            <!-- 開始日 -->
            <div class="order-row">

                <label class="order-label">
                    開始日
                    <span class="required">*</span>
                </label>

                <input type="date"
                       class="form-control order-date"
                       value="2026-10-25">

            </div>


            <!-- 納期 -->
            <div class="order-row">

                <label class="order-label">
                    納期
                    <span class="required">*</span>
                </label>

                <input type="date"
                       class="form-control order-date"
                       value="2026-10-30">

            </div>


            <!-- ステータス -->
            <div class="order-row">

                <label class="order-label">
                    ステータス
                    <span class="required">*</span>
                </label>

                <select class="form-control order-select">
                    <option selected>未開始</option>
                    <option>開始済</option>
                    <option>完了</option>
                </select>

            </div>


            <!-- ロット番号 -->
            <div class="order-row">

                <label class="order-label">
                    ロット番号
                </label>

                <input type="text"
                       class="form-control order-input"
                       value="LOT-20261025-A">

            </div>


            <!-- 備考 -->
            <div class="order-row order-remarks-row">

                <label class="order-label">
                    備考
                </label>

                <textarea class="form-control order-remarks">通常生産</textarea>

            </div>

        </div>

    </div>


    <!-- 下部ボタン -->
    <div class="order-button-area">

        <button type="button"
                class="order-cancel">
            キャンセル
        </button>

        <button type="button"
                class="order-register">
            製造指示を登録
        </button>

    </div>

</div>

</body>
</html>
